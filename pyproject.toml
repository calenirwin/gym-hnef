[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "hnef"
version = "0.1.0"
description = "A deterministic Hnefatafl engine and research playground"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["pettingzoo>=1.25,<2", "gymnasium>=1,<2", "numpy>=2,<3"]
train = ["torch>=2.6,<3"]

[project.scripts]
hnef = "hnef.cli:main"
hnef-rl = "hnef.learning.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hnef"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
