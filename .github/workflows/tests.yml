name: Modern engine

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra rl
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv run --no-sync hnef benchmark --games 100 --seed 0
      - run: uv run --no-sync hnef benchmark --ruleset copenhagen-experimental-v1 --games 10 --max-plies 200 --seed 0
      - run: uv run --no-sync hnef benchmark --ruleset copenhagen-experimental-v2 --games 10 --max-plies 200 --seed 0
      - run: uv run --no-sync hnef benchmark --attackers mcts --defenders heuristic --games 3 --iterations 16 --rollout-plies 12 --max-plies 100 --seed 0
